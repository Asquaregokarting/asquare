name: Release Please

on:
  push:
    branches: [ main ]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          # When a release-please PR is merged this action tags the commit
          # and updates CHANGELOG.md based on Conventional Commits messages.
          # See https://github.com/googleapis/release-please-action
          release-type: node
          package-name: asquare_app
