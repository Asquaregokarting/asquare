<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../colors_and_type.css" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: #050505;
        color: #fff;
        font-family: 'Inter', sans-serif;
      }
      .card {
        padding: 24px;
        min-height: 150px;
        position: relative;
        overflow: hidden;
      }
      .row {
        display: flex;
        gap: 16px;
        align-items: center;
      }
      .col {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .swatch {
        width: 86px;
        height: 86px;
        border-radius: 12px;
        border: 1px solid rgba(255, 255, 255, 0.06);
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        padding: 8px;
      }
      .swatch .hex {
        font-family: 'JetBrains Mono', monospace;
        font-size: 10px;
        color: #fff;
        opacity: 0.85;
      }
      .swatch .lab {
        font-size: 10px;
        color: rgba(255, 255, 255, 0.75);
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="row">
        <div
          class="swatch"
          style="background: #ff6b00; box-shadow: 0 0 20px rgba(255, 107, 0, 0.5)"
        >
          <span class="lab">SECONDARY 500</span><span class="hex">#FF6B00</span>
        </div>
        <div class="swatch" style="background: #ffa347">
          <span class="lab">400</span><span class="hex">#FFA347</span>
        </div>
        <div class="swatch" style="background: #ffcc99; color: #331500">
          <span class="lab" style="color: #331500">200</span
          ><span class="hex" style="color: #331500">#FFCC99</span>
        </div>
        <div class="swatch" style="background: #994000">
          <span class="lab">700</span><span class="hex">#994000</span>
        </div>
        <div class="swatch" style="background: #331500">
          <span class="lab">900</span><span class="hex">#331500</span>
        </div>
        <div class="col" style="margin-left: 12px">
          <div style="font-family: 'Outfit'; font-weight: 700; font-size: 18px">Vivid Orange</div>
          <div style="color: #b3b3b3; font-size: 12px; max-width: 220px; line-height: 1.4">
            Membership tiers, "Your Reward" coupons, secondary CTAs.
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
