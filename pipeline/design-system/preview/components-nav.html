<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Outfit:wght@700;800&display=swap"
    />
    <style>
      html,
      body {
        margin: 0;
        background: #050505;
        color: #fff;
        font-family: 'Inter', sans-serif;
      }
      .wrap {
        padding: 24px;
        min-height: 180px;
        position: relative;
        overflow: hidden;
      }
      .wrap::before {
        content: '';
        position: absolute;
        inset: 0;
        background:
          radial-gradient(circle at 30% 40%, rgba(0, 102, 255, 0.1), transparent 40%),
          radial-gradient(circle at 80% 60%, rgba(255, 107, 0, 0.08), transparent 40%);
        pointer-events: none;
      }
      .header {
        position: relative;
        background: rgba(10, 10, 10, 0.3);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.06);
        border-radius: 16px;
        padding: 12px 16px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 16px;
      }
      .avatar {
        width: 36px;
        height: 36px;
        border-radius: 999px;
        background: #2a2a2a;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 600;
      }
      .name {
        font-size: 14px;
        font-weight: 500;
      }
      .tier {
        font-size: 11px;
        color: #ffa347;
        margin-top: 2px;
        display: flex;
        align-items: center;
        gap: 4px;
      }
      .iconbtn {
        width: 36px;
        height: 36px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.05);
        display: flex;
        align-items: center;
        justify-content: center;
        color: #fff;
        position: relative;
      }
      .nav {
        position: relative;
        background: rgba(10, 10, 10, 0.9);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 16px;
        padding: 6px;
        display: flex;
        justify-content: space-around;
      }
      .tab {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2px;
        padding: 8px 4px;
        border-radius: 10px;
        font-size: 10px;
        font-weight: 700;
        color: rgba(255, 255, 255, 0.4);
      }
      .tab.active {
        background: rgba(255, 255, 255, 0.1);
        color: #fff;
      }
      .dot {
        width: 18px;
        height: 18px;
        border-radius: 4px;
        background: currentColor;
        opacity: 0.6;
      }
      .tab.active .dot {
        opacity: 1;
        filter: drop-shadow(0 0 6px #0066ff);
      }
      .lab {
        font-family: 'Outfit';
        font-weight: 700;
        font-size: 16px;
        position: relative;
      }
      .sub {
        color: #b3b3b3;
        font-size: 12px;
        position: relative;
        margin-top: -8px;
        margin-bottom: 12px;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="lab">Glass Nav Surfaces</div>
      <div class="sub">
        Sticky header + floating bottom nav — both use backdrop-blur over translucent black.
      </div>
      <div class="header">
        <div style="display: flex; gap: 10px; align-items: center">
          <div class="avatar">S</div>
          <div>
            <div class="name">Shreya</div>
            <div class="tier">◆ Gold Member</div>
          </div>
        </div>
        <div style="display: flex; gap: 10px">
          <div class="iconbtn">🛒</div>
          <div
            style="
              display: flex;
              gap: 4px;
              align-items: center;
              color: #4d94ff;
              font-size: 13px;
              font-weight: 600;
            "
          >
            Offers
          </div>
        </div>
      </div>
      <div class="nav">
        <div class="tab active">
          <div class="dot"></div>
          Games
        </div>
        <div class="tab">
          <div class="dot"></div>
          Wallet
        </div>
        <div class="tab">
          <div class="dot"></div>
          Bookings
        </div>
        <div class="tab">
          <div class="dot"></div>
          Play
        </div>
        <div class="tab">
          <div class="dot"></div>
          Me
        </div>
      </div>
    </div>
  </body>
</html>
