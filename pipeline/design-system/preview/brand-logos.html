<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html,
      body {
        margin: 0;
        background: #050505;
        color: #fff;
        font-family: 'Inter', sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 220px;
      }
      .wrap {
        display: flex;
        gap: 24px;
        align-items: center;
        padding: 16px 24px;
        flex-wrap: wrap;
      }
      img {
        height: 60px;
      }
      .b {
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(255, 255, 255, 0.06);
        border-radius: 16px;
        padding: 18px 24px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .icon {
        width: 64px;
        height: 64px;
        border-radius: 12px;
        background: #000;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      .icon img {
        height: 100%;
        width: 100%;
        object-fit: contain;
      }
      .lab {
        font-family: 'Outfit';
        font-weight: 700;
        font-size: 14px;
        color: #b3b3b3;
        text-align: center;
        margin-top: 8px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }
      .col {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="col">
        <div class="b"><img src="../assets/asquare-logo.png" /></div>
        <div class="lab">Dark · with ticker</div>
      </div>
      <div class="col">
        <div class="b" style="background: #fff"><img src="../assets/asquare-logo-light.png" /></div>
        <div class="lab">Light · light bg</div>
      </div>
      <div class="col">
        <div class="icon"><img src="../assets/logo.webp" /></div>
        <div class="lab">Square mark</div>
      </div>
    </div>
  </body>
</html>
