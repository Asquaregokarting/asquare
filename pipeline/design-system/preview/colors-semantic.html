<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html,
      body {
        margin: 0;
        background: #050505;
        color: #fff;
        font-family: 'Inter', sans-serif;
      }
      .card {
        padding: 24px;
        min-height: 150px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 12px;
        margin-top: 14px;
      }
      .tok {
        border: 1px solid rgba(255, 255, 255, 0.06);
        border-radius: 10px;
        padding: 10px;
        background: #0f0f0f;
      }
      .dot {
        width: 24px;
        height: 24px;
        border-radius: 999px;
        margin-bottom: 8px;
      }
      .n {
        font-size: 11px;
        font-weight: 700;
        color: #fff;
      }
      .h {
        font-size: 10px;
        color: #808080;
        font-family: 'JetBrains Mono', monospace;
        margin-top: 2px;
      }
      .title {
        font-family: 'Outfit';
        font-weight: 700;
        font-size: 16px;
      }
      .sub {
        color: #b3b3b3;
        font-size: 12px;
        margin-top: 4px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="title">Semantic — Pipeline Admin</div>
      <div class="sub">Status tones use 10% fill + 35% border alpha for pill badges.</div>
      <div class="grid">
        <div class="tok">
          <div class="dot" style="background: #4ade80"></div>
          <div class="n">success</div>
          <div class="h">#4ADE80</div>
        </div>
        <div class="tok">
          <div class="dot" style="background: #facc15"></div>
          <div class="n">warning</div>
          <div class="h">#FACC15</div>
        </div>
        <div class="tok">
          <div class="dot" style="background: #f87171"></div>
          <div class="n">critical</div>
          <div class="h">#F87171</div>
        </div>
        <div class="tok">
          <div class="dot" style="background: #60a5fa"></div>
          <div class="n">info</div>
          <div class="h">#60A5FA</div>
        </div>
        <div class="tok">
          <div class="dot" style="background: #2dd4bf"></div>
          <div class="n">accent</div>
          <div class="h">#2DD4BF</div>
        </div>
        <div class="tok">
          <div
            class="dot"
            style="background: rgba(255, 255, 255, 0.62); border: 1px solid #333"
          ></div>
          <div class="n">muted</div>
          <div class="h">#FFFFFF · 62%</div>
        </div>
        <div class="tok">
          <div class="dot" style="background: #13203d; border: 1px solid #334155"></div>
          <div class="n">panel</div>
          <div class="h">#13203D</div>
        </div>
        <div class="tok">
          <div class="dot" style="background: #000519; border: 1px solid #334155"></div>
          <div class="n">base</div>
          <div class="h">#000519</div>
        </div>
      </div>
    </div>
  </body>
</html>
