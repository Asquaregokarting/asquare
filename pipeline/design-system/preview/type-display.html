<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@700;800&display=swap"
    />
    <style>
      html,
      body {
        margin: 0;
        background: #050505;
        color: #fff;
        font-family: 'Inter', sans-serif;
      }
      .card {
        padding: 28px;
        min-height: 260px;
      }
      .d {
        font-family: 'Outfit';
        font-weight: 800;
        font-size: 56px;
        line-height: 1;
        letter-spacing: -0.02em;
      }
      .h1 {
        font-family: 'Outfit';
        font-weight: 700;
        font-size: 36px;
        line-height: 1.1;
        letter-spacing: -0.02em;
        margin-top: 12px;
      }
      .h2 {
        font-family: 'Outfit';
        font-weight: 700;
        font-size: 28px;
        line-height: 1.2;
        letter-spacing: -0.02em;
        margin-top: 8px;
      }
      .h3 {
        font-family: 'Outfit';
        font-weight: 600;
        font-size: 22px;
        margin-top: 8px;
      }
      .meta {
        margin-top: 10px;
        font-size: 11px;
        color: #808080;
        font-family: 'JetBrains Mono', monospace;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="d">Ready to Race</div>
      <div class="h1">Book your slot</div>
      <div class="h2">Electric Go-Karting</div>
      <div class="h3">Gate closes 10 mins before</div>
      <div class="meta">Outfit — display · 800/700/700/600 · tracking −0.02em</div>
    </div>
  </body>
</html>
