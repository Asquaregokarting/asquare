<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: #050505;
        color: #fff;
        font-family: 'Inter', sans-serif;
      }
      .card {
        padding: 24px;
        min-height: 150px;
      }
      .scale {
        display: flex;
        gap: 6px;
        align-items: flex-end;
        margin-top: 16px;
      }
      .s {
        flex: 1;
        height: 80px;
        border-radius: 10px;
        border: 1px solid rgba(255, 255, 255, 0.05);
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        padding: 6px 8px;
      }
      .s .n {
        font-size: 10px;
        color: rgba(255, 255, 255, 0.7);
        font-family: 'JetBrains Mono', monospace;
      }
      .s .h {
        font-size: 9px;
        color: rgba(255, 255, 255, 0.5);
        font-family: 'JetBrains Mono', monospace;
      }
      .title {
        font-family: 'Outfit';
        font-weight: 700;
        font-size: 16px;
      }
      .sub {
        color: #b3b3b3;
        font-size: 12px;
        margin-top: 4px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="title">Dark Scale — Surfaces & Borders</div>
      <div class="sub">
        11 steps from deep black base (950) to near-white (50). Used for panels, muted text,
        borders.
      </div>
      <div class="scale">
        <div class="s" style="background: #050505">
          <span class="n">950</span><span class="h">050505</span>
        </div>
        <div class="s" style="background: #0a0a0a">
          <span class="n">900</span><span class="h">0A0A0A</span>
        </div>
        <div class="s" style="background: #0f0f0f">
          <span class="n">800</span><span class="h">0F0F0F</span>
        </div>
        <div class="s" style="background: #171717">
          <span class="n">700</span><span class="h">171717</span>
        </div>
        <div class="s" style="background: #1f1f1f">
          <span class="n">600</span><span class="h">1F1F1F</span>
        </div>
        <div class="s" style="background: #2a2a2a">
          <span class="n">500</span><span class="h">2A2A2A</span>
        </div>
        <div class="s" style="background: #4d4d4d">
          <span class="n">400</span><span class="h">4D4D4D</span>
        </div>
        <div class="s" style="background: #808080">
          <span class="n">300</span><span class="h">808080</span>
        </div>
        <div class="s" style="background: #b3b3b3; color: #111">
          <span class="n" style="color: #111">200</span
          ><span class="h" style="color: #333">B3B3B3</span>
        </div>
        <div class="s" style="background: #e0e0e0; color: #111">
          <span class="n" style="color: #111">100</span
          ><span class="h" style="color: #333">E0E0E0</span>
        </div>
        <div class="s" style="background: #f5f5f5; color: #111">
          <span class="n" style="color: #111">50</span
          ><span class="h" style="color: #333">F5F5F5</span>
        </div>
      </div>
    </div>
  </body>
</html>
