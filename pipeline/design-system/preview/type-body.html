<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    />
    <style>
      html,
      body {
        margin: 0;
        background: #050505;
        color: #fff;
        font-family: 'Inter', sans-serif;
      }
      .card {
        padding: 28px;
        min-height: 240px;
      }
      .body {
        font-size: 16px;
        line-height: 1.5;
        color: #fff;
      }
      .sm {
        font-size: 14px;
        color: #b3b3b3;
        margin-top: 10px;
        line-height: 1.5;
      }
      .eyebrow {
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: #b3b3b3;
        font-weight: 600;
        margin-top: 14px;
      }
      .cap {
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: #808080;
        font-weight: 500;
        margin-top: 6px;
      }
      .meta {
        margin-top: 14px;
        font-size: 11px;
        color: #808080;
        font-family: 'JetBrains Mono', monospace;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <p class="body">
        Browse and book go-karting, bowling, and adventure activities across 4 cities in Andhra
        Pradesh.
      </p>
      <p class="sm">
        Your wallet balance, saved cards, and past bookings are accessible from the Me tab.
      </p>
      <div class="eyebrow">SELECT BRANCH</div>
      <div class="cap">NEW USERS · 14PX</div>
      <div class="meta">Inter — 400 body · 400 sm · 600 eyebrow · 500 caption</div>
    </div>
  </body>
</html>
