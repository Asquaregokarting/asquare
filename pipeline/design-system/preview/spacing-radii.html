<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html,
      body {
        margin: 0;
        background: #050505;
        color: #fff;
        font-family: 'Inter', sans-serif;
      }
      .card {
        padding: 24px;
        min-height: 180px;
        display: flex;
        gap: 24px;
        align-items: center;
        flex-wrap: wrap;
      }
      .r {
        width: 60px;
        height: 60px;
        background: rgba(0, 102, 255, 0.15);
        border: 1px solid rgba(0, 102, 255, 0.4);
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: 'JetBrains Mono', monospace;
        font-size: 10px;
        color: #4d94ff;
      }
      .r.pill {
        border-radius: 9999px;
      }
      .lab {
        font-size: 10px;
        color: #808080;
        margin-top: 6px;
        text-align: center;
        font-family: 'JetBrains Mono', monospace;
      }
      .col {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0;
      }
      .title {
        font-family: 'Outfit';
        font-weight: 700;
        font-size: 16px;
        width: 100%;
      }
      .sub {
        color: #b3b3b3;
        font-size: 12px;
        width: 100%;
        margin-top: -10px;
        margin-bottom: 4px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="title">Corner Radius</div>
      <div class="sub">12px default (buttons/inputs/cards). Full round for pills and avatars.</div>
      <div class="col">
        <div class="r" style="border-radius: 8px">8</div>
        <div class="lab">sm · chips</div>
      </div>
      <div class="col">
        <div class="r" style="border-radius: 12px">12</div>
        <div class="lab">md · btn/card</div>
      </div>
      <div class="col">
        <div class="r pill">∞</div>
        <div class="lab">pill · avatar</div>
      </div>
    </div>
  </body>
</html>
