<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Outfit:wght@700;800;900&display=swap"
    />
    <style>
      html,
      body {
        margin: 0;
        background: #050505;
        color: #fff;
        font-family: 'Inter', sans-serif;
      }
      .wrap {
        padding: 20px;
        min-height: 260px;
        position: relative;
        overflow: hidden;
      }
      .wrap::before {
        content: '';
        position: absolute;
        inset: 0;
        background:
          radial-gradient(circle at 15% 50%, rgba(0, 102, 255, 0.08), transparent 25%),
          radial-gradient(circle at 85% 30%, rgba(255, 107, 0, 0.08), transparent 25%);
        pointer-events: none;
      }
      .grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 14px;
        position: relative;
      }
      .glass {
        background: rgba(15, 15, 15, 0.4);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.05);
        border-radius: 16px;
        padding: 16px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
      }
      .glass.active {
        background: rgba(15, 15, 15, 0.6);
        border: 1px solid rgba(0, 102, 255, 0.3);
        box-shadow: 0 0 20px rgba(0, 102, 255, 0.3);
        transform: scale(0.98);
      }
      .img {
        height: 90px;
        border-radius: 10px;
        background: linear-gradient(135deg, #1a75ff, #0066ff, #003d99);
        margin-bottom: 10px;
      }
      .img.o {
        background: linear-gradient(135deg, #ffa347, #ff6b00, #994000);
      }
      .title {
        font-family: 'Outfit';
        font-weight: 700;
        font-size: 15px;
      }
      .price {
        font-family: 'Outfit';
        font-weight: 800;
        font-size: 18px;
        color: #4d94ff;
        margin-top: 4px;
      }
      .meta {
        font-size: 11px;
        color: #b3b3b3;
        margin-top: 2px;
      }
      .state {
        position: absolute;
        top: 10px;
        right: 14px;
        font-size: 10px;
        color: #808080;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        font-weight: 600;
      }
      .lab {
        font-family: 'Outfit';
        font-weight: 700;
        font-size: 16px;
        margin-bottom: 4px;
      }
      .sub {
        color: #b3b3b3;
        font-size: 12px;
        margin-bottom: 14px;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="lab">Glass Cards</div>
      <div class="sub">Default and active (pressed) — glow ring replaces shadow, 0.98 scale.</div>
      <div class="grid">
        <div class="glass" style="position: relative">
          <span class="state">DEFAULT</span>
          <div class="img"></div>
          <div class="title">Electric Go-Karting</div>
          <div class="meta">8 laps · 15 min</div>
          <div class="price">₹699</div>
        </div>
        <div class="glass active" style="position: relative">
          <span class="state" style="color: #4d94ff">PRESSED</span>
          <div class="img o"></div>
          <div class="title">VR Arena — Pro</div>
          <div class="meta">Single player · 20 min</div>
          <div class="price">₹499</div>
        </div>
      </div>
    </div>
  </body>
</html>
