<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../colors_and_type.css" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: #050505;
        color: #fff;
        font-family: 'Inter', sans-serif;
      }
      .card {
        padding: 24px;
        min-height: 150px;
        position: relative;
        overflow: hidden;
      }
      .card::before {
        content: '';
        position: absolute;
        inset: 0;
        background:
          radial-gradient(circle at 15% 50%, rgba(0, 102, 255, 0.06), transparent 30%),
          radial-gradient(circle at 85% 30%, rgba(255, 107, 0, 0.06), transparent 30%);
        pointer-events: none;
      }
      .row {
        display: flex;
        gap: 16px;
        align-items: center;
        position: relative;
      }
      .col {
        display: flex;
        flex-direction: column;
        gap: 8px;
        position: relative;
      }
      .swatch {
        width: 86px;
        height: 86px;
        border-radius: 12px;
        border: 1px solid rgba(255, 255, 255, 0.06);
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        padding: 8px;
      }
      .swatch .hex {
        font-family: 'JetBrains Mono', monospace;
        font-size: 10px;
        color: #fff;
        opacity: 0.85;
      }
      .swatch .lab {
        font-size: 10px;
        color: rgba(255, 255, 255, 0.7);
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }
      .chip {
        padding: 3px 10px;
        border-radius: 999px;
        font-size: 10px;
        font-family: 'JetBrains Mono', monospace;
        border: 1px solid rgba(255, 255, 255, 0.1);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="row">
        <div
          class="swatch"
          style="background: #0066ff; box-shadow: 0 0 20px rgba(0, 102, 255, 0.5)"
        >
          <span class="lab">PRIMARY 500</span><span class="hex">#0066FF</span>
        </div>
        <div class="swatch" style="background: #1a75ff">
          <span class="lab">400</span><span class="hex">#1A75FF</span>
        </div>
        <div class="swatch" style="background: #4d94ff">
          <span class="lab">300</span><span class="hex">#4D94FF</span>
        </div>
        <div class="swatch" style="background: #003d99">
          <span class="lab">700</span><span class="hex">#003D99</span>
        </div>
        <div class="swatch" style="background: #001433">
          <span class="lab">900</span><span class="hex">#001433</span>
        </div>
        <div class="col" style="margin-left: 12px">
          <div style="font-family: 'Outfit'; font-weight: 700; font-size: 18px">Electric Blue</div>
          <div style="color: #b3b3b3; font-size: 12px; max-width: 220px; line-height: 1.4">
            CTAs, focus rings, glow halos. The brand signature on dark surfaces.
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
