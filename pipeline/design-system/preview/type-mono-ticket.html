<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Oswald:wght@700&display=swap"
    />
    <style>
      html,
      body {
        margin: 0;
        background: #050505;
        color: #fff;
        font-family: 'Inter', sans-serif;
      }
      .card {
        padding: 28px;
        min-height: 240px;
      }
      .mono {
        font-family: 'JetBrains Mono', monospace;
        font-size: 14px;
        color: #fff;
      }
      .code {
        display: inline-block;
        padding: 6px 10px;
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.1);
        font-family: 'JetBrains Mono', monospace;
        font-size: 13px;
        color: #1a75ff;
        margin-top: 8px;
      }
      .oswald {
        font-family: 'Oswald', sans-serif;
        font-weight: 700;
        font-size: 44px;
        letter-spacing: 0.04em;
        margin-top: 18px;
      }
      .oswald-sm {
        font-family: 'Oswald', sans-serif;
        font-weight: 700;
        font-size: 18px;
        letter-spacing: 0.1em;
        color: #eab308;
      }
      .meta {
        margin-top: 14px;
        font-size: 11px;
        color: #808080;
        font-family: 'JetBrains Mono', monospace;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="mono">coupon: <span style="color: #4d94ff">SPIN2025</span></div>
      <div class="code">H-341-4B</div>
      <div class="oswald-sm">SKY CLASS ACCESS</div>
      <div class="oswald">H-PAD SKY</div>
      <div class="meta">JetBrains Mono — codes · Oswald — boarding-pass numerals only</div>
    </div>
  </body>
</html>
