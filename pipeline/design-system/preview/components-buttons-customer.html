<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap"
    />
    <style>
      html,
      body {
        margin: 0;
        background: #050505;
        color: #fff;
        font-family: 'Inter', sans-serif;
      }
      .card {
        padding: 32px;
        min-height: 200px;
        display: flex;
        gap: 20px;
        flex-wrap: wrap;
        align-items: center;
      }
      .lab {
        width: 100%;
        font-family: 'Inter';
        font-weight: 800;
        font-size: 16px;
        margin-bottom: -4px;
        letter-spacing: -0.01em;
      }
      .sub {
        color: #b3b3b3;
        font-size: 12px;
        width: 100%;
        margin-top: -14px;
        margin-bottom: 8px;
      }

      /* shared */
      .btn {
        font-family: 'Inter';
        font-weight: 700;
        border-radius: 12px;
        border: none;
        cursor: pointer;
        font-size: 14px;
        color: #fff;
        position: relative;
        overflow: hidden;
      }

      /* 1. Proceed to Cart — cart sweeps in from left, text slides right */
      .cart-btn {
        width: 172px;
        height: 44px;
        background: #0066ff;
        box-shadow: 0 8px 30px rgba(0, 102, 255, 0.4);
        display: flex;
        align-items: center;
        justify-content: center;
        transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
      }
      .cart-btn .icn {
        position: absolute;
        left: -44px;
        width: 28px;
        height: 28px;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 2;
        transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
      }
      .cart-btn .txt {
        z-index: 1;
        transition: transform 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
        display: inline-block;
      }
      .cart-btn:hover .icn {
        transform: translateX(66px);
      }
      .cart-btn:hover .txt {
        transform: translateX(16px);
      }
      .cart-btn:active {
        transform: scale(0.96);
      }

      /* 2. Book Now — arrow slide + glow lift */
      .book-btn {
        padding: 12px 22px 12px 22px;
        background: #ff6b00;
        box-shadow: 0 0 20px rgba(255, 107, 0, 0.5);
        display: inline-flex;
        align-items: center;
        gap: 8px;
        transition:
          box-shadow 0.3s ease,
          transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
      }
      .book-btn .arr {
        display: inline-block;
        transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
      }
      .book-btn:hover {
        box-shadow:
          0 8px 36px rgba(255, 107, 0, 0.7),
          0 0 24px rgba(255, 107, 0, 0.6);
        transform: translateY(-2px);
      }
      .book-btn:hover .arr {
        transform: translateX(6px);
      }
      .book-btn:active {
        transform: translateY(0) scale(0.97);
      }

      /* 3. Cancel — dark red, X icon rotates in + background deepens */
      .cancel-btn {
        padding: 12px 22px;
        background: #7a1a1a;
        color: #fff;
        border: 1px solid rgba(248, 113, 113, 0.35);
        display: inline-flex;
        align-items: center;
        gap: 10px;
        transition:
          background 0.3s ease,
          box-shadow 0.3s ease,
          transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
        position: relative;
        overflow: hidden;
      }
      .cancel-btn::before {
        content: '';
        position: absolute;
        inset: 0;
        background: radial-gradient(circle at 50% 120%, rgba(248, 113, 113, 0.45), transparent 55%);
        opacity: 0;
        transition: opacity 0.4s ease;
      }
      .cancel-btn .x {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 18px;
        height: 18px;
        transform: rotate(-90deg) scale(0.6);
        opacity: 0;
        transition:
          transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1),
          opacity 0.3s ease,
          margin 0.35s ease;
        margin-right: -18px;
      }
      .cancel-btn .lbl {
        position: relative;
        z-index: 1;
        transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
      }
      .cancel-btn:hover {
        background: #5c1010;
        box-shadow:
          0 0 20px rgba(248, 113, 113, 0.35),
          inset 0 0 0 1px rgba(248, 113, 113, 0.55);
      }
      .cancel-btn:hover::before {
        opacity: 1;
      }
      .cancel-btn:hover .x {
        transform: rotate(0deg) scale(1);
        opacity: 1;
        margin-right: 0;
      }
      .cancel-btn:active {
        transform: scale(0.96);
      }

      /* 4. Skip — ghost with underline reveal */
      .skip-btn {
        padding: 12px 16px;
        background: transparent;
        color: #fff;
        font-weight: 600;
        position: relative;
      }
      .skip-btn::after {
        content: '';
        position: absolute;
        left: 16px;
        right: 16px;
        bottom: 8px;
        height: 1.5px;
        background: #0066ff;
        transform: scaleX(0);
        transform-origin: left center;
        transition: transform 0.4s cubic-bezier(0.2, 0.7, 0.2, 1);
      }
      .skip-btn:hover {
        color: #4d94ff;
      }
      .skip-btn:hover::after {
        transform: scaleX(1);
      }

      /* 5. Disabled */
      .dis {
        padding: 12px 22px;
        background: #0066ff;
        opacity: 0.35;
        cursor: not-allowed;
        color: rgba(255, 255, 255, 0.7);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="lab">Buttons — Customer</div>
      <div class="sub">
        Hover each button to preview the motion. Primary CTA (Proceed to Cart) sweeps the cart icon
        across on hover; Book Now lifts with a stronger halo; Cancel deepens to oxblood red and
        reveals an X icon; skip reveals an underline.
      </div>

      <button class="btn cart-btn" type="button">
        <span class="icn" aria-hidden="true">
          <svg width="16" height="16" viewBox="0 0 576 512" fill="#fff">
            <path
              d="M0 24C0 10.7 10.7 0 24 0H69.5c22 0 41.5 12.8 50.6 32h411c26.3 0 45.5 25 38.6 50.4l-41 152.3c-8.5 31.4-37 53.3-69.5 53.3H170.7l5.4 28.5c2.2 11.3 12.1 19.5 23.6 19.5H488c13.3 0 24 10.7 24 24s-10.7 24-24 24H199.7c-34.6 0-64.3-24.6-70.7-58.5L77.4 54.5c-.7-3.8-4-6.5-7.9-6.5H24C10.7 48 0 37.3 0 24zM128 464a48 48 0 1 1 96 0 48 48 0 1 1 -96 0zm336-48a48 48 0 1 1 0 96 48 48 0 1 1 0-96z"
            />
          </svg>
        </span>
        <span class="txt">Proceed to Cart</span>
      </button>

      <button class="btn book-btn" type="button">Book Now <span class="arr">→</span></button>

      <button class="btn cancel-btn" type="button">
        <span class="x" aria-hidden="true">
          <svg
            width="14"
            height="14"
            viewBox="0 0 24 24"
            fill="none"
            stroke="#fff"
            stroke-width="2.4"
            stroke-linecap="round"
          >
            <path d="M6 6l12 12M18 6L6 18" />
          </svg>
        </span>
        <span class="lbl">Cancel</span>
      </button>

      <button class="btn skip-btn" type="button">Skip</button>

      <button class="btn dis" type="button" disabled>Disabled</button>
    </div>
  </body>
</html>
