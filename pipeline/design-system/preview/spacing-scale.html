<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html,
      body {
        margin: 0;
        background: #050505;
        color: #fff;
        font-family: 'Inter', sans-serif;
      }
      .card {
        padding: 24px;
        min-height: 180px;
      }
      .row {
        display: flex;
        align-items: flex-end;
        gap: 12px;
        margin-top: 14px;
      }
      .s {
        background: #0066ff;
        border-radius: 4px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #fff;
        font-family: 'JetBrains Mono', monospace;
        font-size: 9px;
        min-width: 2px;
      }
      .col {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
      }
      .lab {
        font-size: 10px;
        color: #cccccc;
        font-family: 'JetBrains Mono', monospace;
      }
      .sub-lab {
        font-size: 9px;
        color: #707070;
        font-family: 'JetBrains Mono', monospace;
        margin-top: -2px;
      }
      .title {
        font-family: 'Outfit';
        font-weight: 700;
        font-size: 16px;
      }
      .sub {
        color: #b3b3b3;
        font-size: 12px;
        margin-top: 4px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="title">Spacing Scale</div>
      <div class="sub">
        2.67px base (2/3 of the classic 4px scale). Most layouts live between 5–21px; 32px for page
        section gaps.
      </div>
      <div class="row">
        <div class="col">
          <div class="s" style="width: 2.67px; height: 2.67px"></div>
          <div class="lab">1</div>
          <div class="sub-lab">2.67</div>
        </div>
        <div class="col">
          <div class="s" style="width: 5.33px; height: 5.33px"></div>
          <div class="lab">2</div>
          <div class="sub-lab">5.33</div>
        </div>
        <div class="col">
          <div class="s" style="width: 8px; height: 8px"></div>
          <div class="lab">3</div>
          <div class="sub-lab">8</div>
        </div>
        <div class="col">
          <div class="s" style="width: 10.67px; height: 10.67px"></div>
          <div class="lab">4</div>
          <div class="sub-lab">10.67</div>
        </div>
        <div class="col">
          <div class="s" style="width: 13.33px; height: 13.33px"></div>
          <div class="lab">5</div>
          <div class="sub-lab">13.33</div>
        </div>
        <div class="col">
          <div class="s" style="width: 16px; height: 16px"></div>
          <div class="lab">6</div>
          <div class="sub-lab">16</div>
        </div>
        <div class="col">
          <div class="s" style="width: 21.33px; height: 21.33px"></div>
          <div class="lab">8</div>
          <div class="sub-lab">21.33</div>
        </div>
        <div class="col">
          <div class="s" style="width: 26.67px; height: 26.67px"></div>
          <div class="lab">10</div>
          <div class="sub-lab">26.67</div>
        </div>
        <div class="col">
          <div class="s" style="width: 32px; height: 32px"></div>
          <div class="lab">12</div>
          <div class="sub-lab">32</div>
        </div>
      </div>
    </div>
  </body>
</html>
